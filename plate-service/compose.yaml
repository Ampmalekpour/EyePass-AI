# =====================================================================
# PLATE MODULE — plate_detector + plate_ocr
# ---------------------------------------------------------------------
#   docker compose up -d --build
#
# One file. Dev vs prod is not a different file, it's different values
# in .env: device + model choice (DETECTION_DEVICE / DETECTION_GPU_MODEL /
# DETECTION_CPU_MODEL / OCR_DEVICE) and deployment (Redis, MinIO, relay,
# ports). Every other setting is in each service's config.py.
#
# Two .env switches select what actually runs (see README "Run it"):
#
#   COMPOSE_FILE=compose.yaml:compose.gpu.yaml   GPU host (adds the
#   COMPOSE_FILE=compose.yaml                    NVIDIA reservation) / CPU host
#
#   COMPOSE_PROFILES=standalone-stream           this module's OWN relay
#   COMPOSE_PROFILES=                            (mediamtx + camera_stream) —
#                                                leave it out to use the whole
#                                                system's shared streamer instead
#                                                (README "Using the system's
#                                                streamer instead of the
#                                                standalone one").
#
# Redis and MinIO are external dependencies (compose.infra.yaml, or
# whatever the platform already runs). No depends_on reaches across
# that boundary on purpose — both services here must survive Redis or
# MinIO vanishing at ANY time, not just at startup: each reconnects on
# its own (platecore.bus.RedisBus.wait_until_available) and self-heals
# back to its last known phase/count on restart.
#
# Two services, independently deployable, talking to each other only
# through Redis (platecore.keys / platecore.codec) — no shared queue,
# no shared process, no HTTP between them:
#   plate_detector   reads camera frames from the MediaMTX relay,
#                    detects + tracks vehicles, evaluates line/ROI
#                    triggers, dispatches OCR tasks. Never touches
#                    MinIO — its debug output (annotated overlay video)
#                    is local bind volume only.
#   plate_ocr        pulls OCR tasks, runs the car/motorcycle PaddleOCR
#                    pipeline, validates + votes, uploads plate/vehicle
#                    crops to MinIO, pushes results back to the owning
#                    detector engine (plate:vehicle:results).
#
# The GPU reservation lives in compose.gpu.yaml (COMPOSE_FILE above), so
# a CPU-only host needs no edit here — set DETECTION_DEVICE=cpu and drop
# compose.gpu.yaml from COMPOSE_FILE. plate_ocr runs CPU-only by default
# regardless, see ocr_service/requirements.txt.
# =====================================================================

name: eyeplate-plate

# No env_file: each service gets exactly the variables listed in its
# `environment:` (all other settings live in each service's config.py).
# ${...} values below are still read from .env by docker compose.
x-common: &common
  restart: unless-stopped
  networks: [platform]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # -------------------------------------------------------------------
  # Detection + tracking + trigger/OCR-dispatch. Self-healing: reads
  # its last known phase + engine_count from Redis on boot and restores
  # itself, without waiting for the backend to resend anything.
  # -------------------------------------------------------------------

  # -------------------------------------------------------------------
  # STANDALONE STREAMER (profile `standalone-stream`): this module's own
  # RTSP relay + camera_stream. On a full EyePass deployment the system
  # already runs ONE shared mediamtx + camera_stream for every module —
  # drop `standalone-stream` from COMPOSE_PROFILES and point
  # MTX_RTSP_BASE_URL / REDIS_* / SHARED_NETWORK at it instead.
  # -------------------------------------------------------------------
  mediamtx:
    <<: *common
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-latest}
    container_name: plate_mediamtx
    profiles: [ standalone-stream ]
    environment:
      TZ: ${TZ:-UTC}
      MTX_LOGLEVEL: ${MTX_LOGLEVEL:-info}
    volumes:
      - ./camera-service/config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${RTSP_PORT:-8554}:8554/tcp"
      - "${WEBRTC_PORT:-8889}:8889/tcp"
      - "${WEBRTC_ICE_UDP_PORT:-8189}:8189/udp"
      - "${HLS_PORT:-8888}:8888/tcp"
      - "${MTX_API_PORT:-9997}:9997"
      - "${RTMP_PORT:-1935}:1935"
    # no healthcheck: the mediamtx image has no shell/wget, so any check
    # would always report "unhealthy" (camera_stream polls its API instead)

  camera_stream:
    <<: *common
    build:
      context: ./camera-service
    image: eyeplate/camera-stream:${IMAGE_TAG:-dev}
    container_name: plate_camera_stream
    profiles: [ standalone-stream ]
    init: true
    labels:
      autoheal: "true"
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB:-0}
      MTX_HOST: mediamtx
      MTX_PORT: "9997"
      STREAM_BASE_URL: ${STREAM_BASE_URL:-localhost:8889}
      CAMERA_STREAM_DEBUG: ${CAMERA_STREAM_DEBUG:-false}
      LOG_FORMAT: ${LOG_FORMAT:-text}

      # ---- camera health / timing (previously bare literals) ---------
      OFFLINE_HOLD_SECONDS: ${OFFLINE_HOLD_SECONDS:-10}
      TRUST_MTX_ONLY: ${TRUST_MTX_ONLY:-true}
      CAMERA_RTSP_PORT: ${CAMERA_RTSP_PORT:-554}
      CAMERA_PING_TIMEOUT_SEC: ${CAMERA_PING_TIMEOUT_SEC:-0.2}
      MTX_POLL_INTERVAL_SEC: ${MTX_POLL_INTERVAL_SEC:-0.5}
      MTX_API_TIMEOUT_SEC: ${MTX_API_TIMEOUT_SEC:-1.5}
      MONITOR_LOOP_INTERVAL_SEC: ${MONITOR_LOOP_INTERVAL_SEC:-0.3}
      MONITOR_IDLE_SLEEP_SEC: ${MONITOR_IDLE_SLEEP_SEC:-1.0}
      REGISTER_CAMERA_TIMEOUT_SEC: ${REGISTER_CAMERA_TIMEOUT_SEC:-1.0}
      REMOVE_FROM_MTX_TIMEOUT_SEC: ${REMOVE_FROM_MTX_TIMEOUT_SEC:-1.0}

      # ---- debug output (local bind volume — never MinIO) -------------
      DEBUG_ROOT_DIR: /debug
      CAMERA_SNAPSHOT_DEBUG_ENABLED: ${CAMERA_SNAPSHOT_DEBUG_ENABLED:-false}
      CAMERA_SNAPSHOT_INTERVAL_SEC: ${CAMERA_SNAPSHOT_INTERVAL_SEC:-60}
      CAMERA_SNAPSHOT_TIMEOUT_SEC: ${CAMERA_SNAPSHOT_TIMEOUT_SEC:-5}
    volumes:
      - ${CAMERA_DEBUG_HOST_DIR:-./debug_camera}:/debug
    depends_on:
      mediamtx:
        condition: service_started


  # -------------------------------------------------------------------
  # Test clips (profile `test-video`): loop TEST_VIDEO_FILE into the relay
  # as camera paths 1..8. TEST_VIDEO_RTSP_BASE_URL is the relay they
  # publish to — this module's own mediamtx by default, or the system's.
  # (No depends_on: publish_loop.sh waits and retries on its own, and the
  # relay may not be part of this compose project at all.)
  # -------------------------------------------------------------------
  video_publisher:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_1
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/1
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_2:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_2
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/2
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_3:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_3
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/3
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_4:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_4
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/4
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_5:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_5
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/5
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_6:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_6
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/6
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_7:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_7
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/7
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_video_publisher_8:
    build: { context: ., dockerfile: Dockerfile.publisher }
    container_name: plate_video_publisher_8
    profiles: [ test-video ]
    environment:
      MTX_RTSP_URL: ${TEST_VIDEO_RTSP_BASE_URL:-rtsp://mediamtx:8554}/8
      VIDEO_FILE: /media/video.mp4
    volumes:
      - ${TEST_VIDEO_FILE:-./test_video.mp4}:/media/video.mp4:ro
    restart: unless-stopped
    networks: [ platform ]

  plate_detector:
    <<: *common
    build:
      context: .
      dockerfile: detector/Dockerfile
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:-base_image_gpu:latest}
        # CPU runtimes baked into the image — pin to the exported/benchmarked versions
        INSTALL_CPU_RUNTIMES: ${INSTALL_CPU_RUNTIMES:-true}
        OPENVINO_VERSION: ${OPENVINO_VERSION:-}
        ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION:-}
    image: eyeplate/plate-detector:${IMAGE_TAG:-dev}
    container_name: plate_detector
    # PID-1 reaper for the spawned engine subprocesses, so a crashed
    # engine does not linger as a zombie.
    init: true
    labels:
      autoheal: "true"     # picked up only if the `watchdog` profile is active
    # Only the device / model choice and the deployment come from .env.
    # Every other setting is in detector/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
      MTX_RTSP_BASE_URL: ${MTX_RTSP_BASE_URL:-rtsp://mediamtx:8554}
      # gpu | cpu | auto
      DETECTION_DEVICE: ${DETECTION_DEVICE:-gpu}
      # GPU: plate_v8n_480 | plate_v8s_640
      DETECTION_GPU_MODEL: ${DETECTION_GPU_MODEL:-plate_v8n_480}
      # CPU: openvino_fp32 | openvino_int8 | onnx
      DETECTION_CPU_MODEL: ${DETECTION_CPU_MODEL:-openvino_fp32}
      DETECTION_MODEL_ROOT: /models

    # No depends_on on mediamtx: the relay may be this module's standalone
    # one or the whole system's (not part of this project), and the RTSP
    # reader reconnects on its own either way.

    volumes:
      # Model folders (plate_v8n_480/, plate_v8s_640/ — README "Models"),
      # mounted read-only so swapping a model needs no rebuild.
      - ${DETECTION_MODELS_DIR:-./models/detection}:/models:ro
      # NOTE: previously also mounted a `detector_data:/data` named
      # docker volume here for "durable local state" — nothing in this
      # module's own code ever writes to /data (confirmed via a full
      # grep of detector/src and ocr_service/src); the only use of /data
      # is Ultralytics' own YOLO_CONFIG_DIR cache (see detector/Dockerfile),
      # which is fine to be ephemeral/rebuildable. Removed — self-healing
      # reads its checkpoint from Redis, never from this volume, matching
      # the face module's own "eliminate dead named volumes" cleanup.
      # Annotated debug video + the new OCR-submission montages. A BIND
      # mount, not a named volume, on purpose: meant to be opened
      # straight off your own disk.
      - ${DEBUG_VIDEO_HOST_DIR:-./debug_video}:/debug
    ports:
      - "${DETECTOR_API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s        # model load + CUDA init / OpenVINO compile on first boot
    stop_grace_period: 60s      # must exceed ENGINE_SHUTDOWN_TIMEOUT_SEC
    deploy:
      resources:
        # Hard CPU quota for this container (all engine processes
        # together), so the detector can't starve plate_ocr, the relay or
        # anything else on the host. Unset/0 = unlimited.
        limits:
          cpus: "${DETECTOR_CPU_LIMIT:-0}"
        # The GPU reservation is added by compose.gpu.yaml (COMPOSE_FILE
        # in .env) — not here, so a CPU-only host needs no edit.

  # -------------------------------------------------------------------
  # Car/motorcycle PaddleOCR worker pool. Scaled independently of
  # detector engine count — OCR capacity is no longer tied 1:1 to
  # detection capacity now that they talk over Redis instead of an
  # in-process queue pair. Self-healing: reads its last known
  # phase + worker_count from Redis on boot. CPU-only by default (see
  # ocr_service/requirements.txt / OCR_DEVICE).
  # -------------------------------------------------------------------
  plate_ocr:
    <<: *common
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
      args:
        # NOTE: this service's own Dockerfile comment (and the README)
        # claim it does NOT need the heavy torch/ultralytics/CUDA base
        # image plate_detector uses — but its FROM line previously
        # hardcoded the exact same ${AI_BASE_IMAGE}, contradicting that.
        # OCR_BASE_IMAGE decouples the two: unset, it defaults to
        # exactly the prior (contradictory-but-working) behavior, so
        # this is a zero-risk change — set OCR_BASE_IMAGE in .env to
        # actually switch to a lighter image. See DEBUGGING.md.
        BASE_IMAGE: ${OCR_BASE_IMAGE:-base_image_gpu:latest}
    image: eyeplate/plate-ocr:${IMAGE_TAG:-dev}
    container_name: plate_ocr
    init: true
    labels:
      autoheal: "true"
    # Only the device and the deployment come from .env; every other
    # setting is in ocr_service/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
      # cpu | gpu
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      # ---- MinIO (platecore/minio_store.py) ---------------------------
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      AWS_ACCESS_KEY_ID_FULL: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY_FULL: ${MINIO_ROOT_PASSWORD}
      AWS_S3_REGION_NAME: ${MINIO_REGION:-us-east-1}
      AWS_S3_USE_SSL: ${MINIO_SECURE:-False}
      AWS_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET:-eyepass-public-bucket}
      AWS_PRIVATE_BUCKET_NAME: ${MINIO_PRIVATE_BUCKET:-eyepass-private-bucket}
    volumes:
      # Operator supplies the PaddleOCR model folders here — see the
      # README's "What you need to provide" table for the exact names
      # each subfolder/file must keep.
      - ${OCR_MODELS_DIR:-./models/ocr}:/models/ocr:ro
      # NEW — the OCR service previously had no local debug output at
      # all. Decision-trace montages land here (never MinIO — same
      # storage-split rule as the detector's debug video).
      - ${OCR_DEBUG_HOST_DIR:-./debug_ocr}:/debug
    ports:
      - "${OCR_API_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s        # PaddleOCR model load + warmup
    stop_grace_period: 45s      # must exceed WORKER_SHUTDOWN_TIMEOUT_SEC
    # Hard CPU quota for this container's whole worker pool
    # (DEFAULT_WORKER_COUNT PaddleOCR processes above, 3 by default) --
    # previously unbounded, so on OCR_DEVICE=cpu these workers
    # competed for the same cores as plate_detector's engines with no
    # limit on either side. See plate_detector's own deploy block for
    # why this matters. Unset/0 = unlimited (prior behavior).
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPU_LIMIT:-0}"

  # -------------------------------------------------------------------
  # CONTROL HUB — owns every track's recognition state for this module.
  # The detector reports track events (born / trigger / crop sent /
  # gone), the OCR workers report results, and the hub alone decides
  # what reaches the backend (plate:vehicle:results) and when. CPU-only and
  # tiny. Self-healing: track state is checkpointed to Redis and
  # restored on restart; unacked stream entries are replayed. Run
  # exactly ONE per module per Redis (a second copy just stands by on
  # the leader lease). See ./control-hub/README.md.
  # -------------------------------------------------------------------
  control_hub:
    <<: *common
    build:
      context: ./control-hub
    image: eyeplate/control-hub:${IMAGE_TAG:-dev}
    container_name: plate_control_hub
    init: true
    labels:
      autoheal: "true"
    # Only the deployment comes from .env; the policy is in control-hub/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
    ports:
      - "${HUB_API_PORT:-8021}:8020"      # /health, /tracks
    stop_grace_period: 15s

  # -------------------------------------------------------------------
  # `restart: unless-stopped` only covers a process that EXITED. It does
  # nothing for a process that is alive and wedged (a hung CUDA call, a
  # deadlocked thread). autoheal watches healthchecks and restarts
  # anything labelled autoheal=true that goes unhealthy. Off by default:
  #   docker compose --profile watchdog up -d
  # -------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: plate_autoheal
    profiles: [watchdog]
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    external: true
    name: ${SHARED_NETWORK:-eyeplate_net}
