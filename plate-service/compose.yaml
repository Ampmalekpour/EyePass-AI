# =====================================================================
# PLATE MODULE — PRODUCTION: plate_detector + plate_ocr + control_hub
# ---------------------------------------------------------------------
#   cp .env.prod.example .env      # replace every [FILL_IN]
#   docker compose up -d --build
#
# Only this module's three services. The platform (backend team)
# provides and runs:
#   * Redis   — the same one Django and camera_stream use (plate:* keys)
#   * MinIO   — plate / vehicle images
#   * the RTSP relay (mediamtx + camera_stream) — frames are read from
#     <MTX_RTSP_BASE_URL>/<camera_id>; camera online/offline arrives on
#     Redis channel plate:camera:events
# All three are reached over the shared Docker network SHARED_NETWORK.
#
# .env decides the device/model (DETECTION_DEVICE, DETECTION_GPU_MODEL,
# DETECTION_CPU_MODEL, OCR_DEVICE) and the deployment values; every other
# setting is in each service's config.py.
#
# GPU host: COMPOSE_FILE=compose.yaml:compose.gpu.yaml in .env (adds the
# NVIDIA reservation — see DEPLOY_LINUX_GPU.md). CPU host: compose.yaml.
#
# No depends_on across services: each one survives Redis / MinIO / the
# relay going away and reconnects on its own, and self-heals back to its
# last phase from Redis after a restart.
# =====================================================================

name: eyeplate-plate

# No env_file: each service gets exactly the variables listed in its
# `environment:` (all other settings live in each service's config.py).
# ${...} values below are still read from .env by docker compose.
x-common: &common
  restart: unless-stopped
  networks: [platform]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # -------------------------------------------------------------------
  # Detection + tracking + trigger/OCR-dispatch. Self-healing: reads
  # its last known phase + engine_count from Redis on boot and restores
  # itself, without waiting for the backend to resend anything.
  # -------------------------------------------------------------------

  plate_detector:
    <<: *common
    build:
      context: .
      dockerfile: detector/Dockerfile
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:?set AI_BASE_IMAGE in .env}
        # CPU runtimes baked into the image — pin to the exported/benchmarked versions
        INSTALL_CPU_RUNTIMES: ${INSTALL_CPU_RUNTIMES:-true}
        OPENVINO_VERSION: ${OPENVINO_VERSION:-}
        ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION:-}
    image: eyeplate/plate-detector:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: plate_detector
    # PID-1 reaper for the spawned engine subprocesses, so a crashed
    # engine does not linger as a zombie.
    init: true
    labels:
      autoheal: "true"     # picked up only if the `watchdog` profile is active
    # Only the device / model choice and the deployment come from .env.
    # Every other setting is in detector/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in .env}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
      MTX_RTSP_BASE_URL: ${MTX_RTSP_BASE_URL:?set MTX_RTSP_BASE_URL in .env}
      # gpu | cpu | auto
      DETECTION_DEVICE: ${DETECTION_DEVICE:-gpu}
      # GPU: plate_v8n_480 | plate_v8s_640
      DETECTION_GPU_MODEL: ${DETECTION_GPU_MODEL:-plate_v8n_480}
      # CPU: openvino_fp32 | openvino_int8 | onnx
      DETECTION_CPU_MODEL: ${DETECTION_CPU_MODEL:-openvino_fp32}
      DETECTION_MODEL_ROOT: /models

    # No depends_on on the relay: it belongs to the platform; the RTSP
    # reader reconnects on its own.

    volumes:
      # Model folders (plate_v8n_480/, plate_v8s_640/ — README "Models"),
      # mounted read-only so swapping a model needs no rebuild.
      - ${DETECTION_MODELS_DIR:-./models/detection}:/models:ro
      # NOTE: previously also mounted a `detector_data:/data` named
      # docker volume here for "durable local state" — nothing in this
      # module's own code ever writes to /data (confirmed via a full
      # grep of detector/src and ocr_service/src); the only use of /data
      # is Ultralytics' own YOLO_CONFIG_DIR cache (see detector/Dockerfile),
      # which is fine to be ephemeral/rebuildable. Removed — self-healing
      # reads its checkpoint from Redis, never from this volume, matching
      # the face module's own "eliminate dead named volumes" cleanup.
      # Annotated debug video + the new OCR-submission montages. A BIND
      # mount, not a named volume, on purpose: meant to be opened
      # straight off your own disk.
      - ${DEBUG_VIDEO_HOST_DIR:-./debug_video}:/debug
    ports:
      - "${DETECTOR_API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s        # model load + CUDA init / OpenVINO compile on first boot
    stop_grace_period: 60s      # must exceed ENGINE_SHUTDOWN_TIMEOUT_SEC
    deploy:
      resources:
        # Hard CPU quota for this container (all engine processes
        # together), so the detector can't starve plate_ocr, the relay or
        # anything else on the host. Unset/0 = unlimited.
        limits:
          cpus: "${DETECTOR_CPU_LIMIT:-0}"
        # The GPU reservation is added by compose.gpu.yaml (COMPOSE_FILE
        # in .env) — not here, so a CPU-only host needs no edit.

  # -------------------------------------------------------------------
  # Car/motorcycle PaddleOCR worker pool. Scaled independently of
  # detector engine count — OCR capacity is no longer tied 1:1 to
  # detection capacity now that they talk over Redis instead of an
  # in-process queue pair. Self-healing: reads its last known
  # phase + worker_count from Redis on boot. CPU-only by default (see
  # ocr_service/requirements.txt / OCR_DEVICE).
  # -------------------------------------------------------------------
  plate_ocr:
    <<: *common
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
      args:
        # NOTE: this service's own Dockerfile comment (and the README)
        # claim it does NOT need the heavy torch/ultralytics/CUDA base
        # image plate_detector uses — but its FROM line previously
        # hardcoded the exact same AI_BASE_IMAGE, contradicting that.
        # OCR_BASE_IMAGE decouples the two: unset, it defaults to
        # exactly the prior (contradictory-but-working) behavior, so
        # this is a zero-risk change — set OCR_BASE_IMAGE in .env to
        # actually switch to a lighter image. See DEBUGGING.md.
        BASE_IMAGE: ${OCR_BASE_IMAGE:?set OCR_BASE_IMAGE in .env}
    image: eyeplate/plate-ocr:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: plate_ocr
    init: true
    labels:
      autoheal: "true"
    # Only the device and the deployment come from .env; every other
    # setting is in ocr_service/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in .env}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
      # cpu | gpu
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      # ---- MinIO (platecore/minio_store.py) ---------------------------
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL in .env}
      AWS_ACCESS_KEY_ID_FULL: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY_FULL: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      AWS_S3_REGION_NAME: ${MINIO_REGION:-us-east-1}
      AWS_S3_USE_SSL: ${MINIO_SECURE:-False}
      AWS_S3_VERIFY: ${MINIO_VERIFY:-False}
      AWS_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET:?set MINIO_PUBLIC_BUCKET in .env}
      AWS_PRIVATE_BUCKET_NAME: ${MINIO_PRIVATE_BUCKET:?set MINIO_PRIVATE_BUCKET in .env}
    volumes:
      # Operator supplies the PaddleOCR model folders here — see the
      # README's "What you need to provide" table for the exact names
      # each subfolder/file must keep.
      - ${OCR_MODELS_DIR:-./models/ocr}:/models/ocr:ro
      # NEW — the OCR service previously had no local debug output at
      # all. Decision-trace montages land here (never MinIO — same
      # storage-split rule as the detector's debug video).
      - ${OCR_DEBUG_HOST_DIR:-./debug_ocr}:/debug
    ports:
      - "${OCR_API_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s        # PaddleOCR model load + warmup
    stop_grace_period: 45s      # must exceed WORKER_SHUTDOWN_TIMEOUT_SEC
    # Hard CPU quota for this container's whole worker pool
    # (DEFAULT_WORKER_COUNT PaddleOCR processes above, 3 by default) --
    # previously unbounded, so on OCR_DEVICE=cpu these workers
    # competed for the same cores as plate_detector's engines with no
    # limit on either side. See plate_detector's own deploy block for
    # why this matters. Unset/0 = unlimited (prior behavior).
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPU_LIMIT:-0}"

  # -------------------------------------------------------------------
  # CONTROL HUB — owns every track's recognition state for this module.
  # The detector reports track events (born / trigger / crop sent /
  # gone), the OCR workers report results, and the hub alone decides
  # what reaches the backend (plate:vehicle:results) and when. CPU-only and
  # tiny. Self-healing: track state is checkpointed to Redis and
  # restored on restart; unacked stream entries are replayed. Run
  # exactly ONE per module per Redis (a second copy just stands by on
  # the leader lease). See ./control-hub/README.md.
  # -------------------------------------------------------------------
  control_hub:
    <<: *common
    build:
      context: ./control-hub
    image: eyeplate/control-hub:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: plate_control_hub
    init: true
    labels:
      autoheal: "true"
    # Only the deployment comes from .env; the policy is in control-hub/src/config.py.
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in .env}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_MODULE: ${REDIS_MODULE:-plate}
    ports:
      - "${HUB_API_PORT:-8021}:8020"      # /health, /tracks
    stop_grace_period: 15s

  # -------------------------------------------------------------------
  # `restart: unless-stopped` only covers a process that EXITED. It does
  # nothing for a process that is alive and wedged (a hung CUDA call, a
  # deadlocked thread). autoheal watches healthchecks and restarts
  # anything labelled autoheal=true that goes unhealthy. Off by default:
  #   docker compose --profile watchdog up -d
  # -------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: plate_autoheal
    profiles: [watchdog]
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    external: true
    name: ${SHARED_NETWORK:?set SHARED_NETWORK in .env}
