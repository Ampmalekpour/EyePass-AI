version: "3.9"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_dev
    env_file:
      - .env
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${WEBRTC_PORT}:${WEBRTC_PORT}"
      - "${API_PORT}:${API_PORT}"
      - "8189:8189/udp"
    restart: unless-stopped
    networks:
      - shared_net
  py_manager:
    build: .
    container_name: py_manager_dev
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: snowa_shared_network
