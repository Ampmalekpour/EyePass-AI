version: "3.9"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_prod
    env_file:
      - .env
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${RTSP_PORT}:${RTSP_PORT}"
      - "${RTMP_PORT}:${RTMP_PORT}"
      - "${HLS_PORT}:${HLS_PORT}"
      - "${WEBRTC_PORT}:${WEBRTC_PORT}"
      - "${API_PORT}:${API_PORT}"
      - "8189:8189/udp"
    restart: always
    networks:
      - shared_net

  redis:
    image: redis:7-alpine
    container_name: camera_redis_prod
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - shared_net

  py_manager:
    image: camera_py_manager:latest
    container_name: py_manager_prod
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=0
    restart: always
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: snowa_shared_network
