# =====================================================================
# HEATMAP MODULE — part of the EyePass suite (ai_service)
# ---------------------------------------------------------------------
# Not run on its own: the suite's root compose.yaml includes this file.
# Enable/disable the whole module with its profile in the root .env:
#     COMPOSE_PROFILES=face,plate,heatmap,fire     (drop "heatmap" to turn it off)
#
# Shared with every other module (defined in the root compose.yaml):
#   redis, minio (+ minio_init), mediamtx (ONE relay), camera_stream (ONE
#   camera manager for all modules), autoheal (--profile watchdog)
#
# Settings: ./.env (this module) with the root ../.env layered on top,
# so shared values (Redis, MinIO, relay URL, base image) live in one
# place. Relay paths come from the suite-wide rule in common/*/relay.py.
#
#   ai_service  frames from the shared relay -> person detection ->
#               per-camera daily occupancy cubes in MinIO -> heatmap:ai:results
# =====================================================================

x-common: &common
  env_file: [.env, ../.env]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  # -------------------------------------------------------------------
  # Detection + heatmap-cube accumulation + periodic MinIO flush.
  # Self-healing: reads its last known phase + engine_count from Redis
  # on boot and restores itself; separately, every camera in ai:active
  # is reconciled and re-attached without the backend resending
  # anything (see README "Self-healing" / "Redis contract").
  # -------------------------------------------------------------------
  ai_service:
    profiles: [heatmap]
    <<: *common
    build:
      context: .
      dockerfile: ai-service/Dockerfile
      args:
        # Same base image the plate/face/fire detectors build from —
        # swap this without touching any code.
        BASE_IMAGE: ${AI_BASE_IMAGE:-base_image_gpu:latest}
    image: eyeplate/heatmap-ai:${IMAGE_TAG:-dev}
    container_name: heatmap_ai_service
    # PID-1 reaper for the spawned engine subprocesses.
    init: true
    labels:
      autoheal: "true"     # picked up only if the `watchdog` profile is active
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MODULE: ${REDIS_MODULE:-heatmap}

      # Inside the network the relay is reachable by name. Point this
      # at your EXISTING mediamtx if ai_service doesn't share a
      # network with it directly.
      MTX_RTSP_BASE_URL: ${MTX_RTSP_BASE_URL:-rtsp://mediamtx:8554}

      # ---- compute --------------------------------------------------
      DETECTION_DEVICE: ${DETECTION_DEVICE:-auto}
      STRICT_DEVICE: ${STRICT_DEVICE:-false}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-0}
      MODEL_PATH: ${MODEL_PATH:-/models/yolov8n.pt}
      IMG_SIZE: ${DETECTION_IMG_SIZE:-800}
      CONF_THRESHOLD: ${DETECTION_CONF_THRESHOLD:-0.25}
      POINT_MODE: ${POINT_MODE:-center}
      DETECTION_ACCUMULATION_INTERVAL: ${DETECTION_ACCUMULATION_INTERVAL:-10}

      # ---- engine topology / self-healing -----------------------------
      MAX_CAMERAS_PER_ENGINE: ${MAX_CAMERAS_PER_ENGINE:-6}
      DEFAULT_ENGINE_COUNT: ${DEFAULT_ENGINE_COUNT:-1}
      ENGINE_SHUTDOWN_TIMEOUT_SEC: ${ENGINE_SHUTDOWN_TIMEOUT_SEC:-30}

      # ---- camera health ----------------------------------------------
      HEARTBEAT_TIMEOUT_SEC: ${HEARTBEAT_TIMEOUT_SEC:-15}
      CAMERA_OFFLINE_GRACE_SECONDS: ${CAMERA_OFFLINE_GRACE_SECONDS:-5}

      # ---- heatmap cube -------------------------------------------------
      SAVE_INTERVAL_SECONDS: ${SAVE_INTERVAL_SECONDS:-60}
      TIME_RESOLUTION_MINUTES: ${TIME_RESOLUTION_MINUTES:-5}
      GRID_WIDTH: ${GRID_WIDTH:-128}
      GRID_HEIGHT: ${GRID_HEIGHT:-72}

      # ---- MinIO (heatmap cubes) ---------------------------------------
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT}
      AWS_ACCESS_KEY_ID_FULL: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY_FULL: ${MINIO_ROOT_PASSWORD}
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_USE_SSL: ${MINIO_SECURE:-False}
      MINIO_BUCKET: ${MINIO_BUCKET:-heatmap-data}

      # ---- legacy plain overlay (no grid), off by default --------------
      SAVE_OUTPUT: ${SAVE_OUTPUT:-false}
      SAVE_AS_VIDEO: ${SAVE_AS_VIDEO:-true}

      # ---- visual debug (grid + density overlay), off by default -------
      DETECTOR_DEBUG_VIDEO_ENABLED: ${DETECTOR_DEBUG_VIDEO_ENABLED:-false}
      DEBUG_VIDEO_DIR: /debug
      DEBUG_VIDEO_SEGMENT_SECONDS: ${DEBUG_VIDEO_SEGMENT_SECONDS:-240}
      DEBUG_VIDEO_FPS: ${DEBUG_VIDEO_FPS:-12}
      DEBUG_VIDEO_MAX_SEGMENTS: ${DEBUG_VIDEO_MAX_SEGMENTS:-12}
      DEBUG_VIDEO_SCALE: ${DEBUG_VIDEO_SCALE:-1.0}
      DEBUG_VIDEO_EVERY_N: ${DEBUG_VIDEO_EVERY_N:-1}
      DEBUG_VIDEO_CODEC: ${DEBUG_VIDEO_CODEC:-mp4v}
      DEBUG_VIDEO_EXT: ${DEBUG_VIDEO_EXT:-.mp4}
      DEBUG_VIDEO_JSONL: ${DEBUG_VIDEO_JSONL:-true}

      API_PORT: "8002"
      # Durable local state (camera_registry.json) — a convenience cache;
      # the AUTHORITATIVE desired state is Redis's {module}:ai:active.
      # The pre-existing standalone build mounted a volume at /data
      # without ever pointing DATA_DIR there, so it went unused — fixed
      # here.
      DATA_DIR: /data

    depends_on:
      mediamtx:
        condition: service_started

    volumes:
      # Model weights, mounted rather than baked so swapping the model
      # needs no rebuild. Operator supplies yolov8n.pt (or their own
      # head-detection weights) here.
      - ${DETECTION_MODELS_DIR:-./models/detection}:/models:ro
      # Annotated debug video. A BIND mount, not a named volume, on
      # purpose: meant to be opened straight off your own disk.
      - ${DEBUG_VIDEO_HOST_DIR:-./debug_video}:/debug
      # camera_registry.json — see DATA_DIR above.
      - ai_data:/data
    ports:
      - "${AI_API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).status in (200,503) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s        # YOLO load + CUDA init is slow on first boot
    stop_grace_period: 60s      # must exceed ENGINE_SHUTDOWN_TIMEOUT_SEC
    # GPU reservation. Requires nvidia-container-toolkit on the host.
    # Delete this whole `deploy:` block to run on a host with no GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

volumes:
  ai_data:
