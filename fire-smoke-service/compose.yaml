# =====================================================================
# FIRE/SMOKE MODULE — part of the EyePass suite (fire_detector)
# ---------------------------------------------------------------------
# Not run on its own: the suite's root compose.yaml includes this file.
# Enable/disable the whole module with its profile in the root .env:
#     COMPOSE_PROFILES=face,plate,heatmap,fire     (drop "fire" to turn it off)
#
# Shared with every other module (defined in the root compose.yaml):
#   redis, minio (+ minio_init), mediamtx (ONE relay), camera_stream (ONE
#   camera manager for all modules), autoheal (--profile watchdog)
#
# Settings: ./.env (this module) with the root ../.env layered on top,
# so shared values (Redis, MinIO, relay URL, base image) live in one
# place. Relay paths come from the suite-wide rule in common/*/relay.py.
#
#   fire_detector  frames from the shared relay -> fire/smoke detection ->
#                  fire:detections:results
# =====================================================================

x-common: &common
  env_file: [.env, ../.env]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  # -------------------------------------------------------------------
  # Detection + spatial-grid threat verification + THREAT/RESOLUTION
  # dispatch. Self-healing: reads its last known phase + engine_count
  # from Redis on boot and restores itself, without waiting for the
  # backend to resend anything.
  # -------------------------------------------------------------------
  fire_detector:
    profiles: [fire]
    <<: *common
    build:
      context: .
      dockerfile: detector/Dockerfile
      args:
        # Same base image the plate and face detectors build from —
        # swap this without touching any code.
        BASE_IMAGE: ${AI_BASE_IMAGE:-base_image_gpu:latest}
    image: eyeplate/fire-detector:${IMAGE_TAG:-dev}
    container_name: fire_detector
    # PID-1 reaper for the spawned engine subprocesses, so a crashed
    # engine does not linger as a zombie.
    init: true
    labels:
      autoheal: "true"     # picked up only if the `watchdog` profile is active
    environment:
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MODULE: ${REDIS_MODULE:-fire}

      # Inside the network the relay is reachable by name. Point this
      # at your EXISTING mediamtx if fire_detector doesn't share a
      # network with it directly.
      MTX_RTSP_BASE_URL: ${MTX_RTSP_BASE_URL:-rtsp://mediamtx:8554}

      # ---- compute --------------------------------------------------
      DETECTION_DEVICE: ${DETECTION_DEVICE:-auto}
      STRICT_DEVICE: ${STRICT_DEVICE:-false}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-0}
      MODEL_PATH: ${DETECTION_MODEL_PATH:-/models/best.pt}
      DETECTION_IMG_SIZE: ${DETECTION_IMG_SIZE:-640}
      DETECTION_CONF_THRESHOLD: ${DETECTION_CONF_THRESHOLD:-0.25}

      # ---- engine topology / self-healing -----------------------------
      MAX_CAMERAS_PER_ENGINE: ${MAX_CAMERAS_PER_ENGINE:-6}
      DEFAULT_ENGINE_COUNT: ${DEFAULT_ENGINE_COUNT:-1}
      ENGINE_REBALANCE_INTERVAL_SEC: ${ENGINE_REBALANCE_INTERVAL_SEC:-30}
      ENGINE_SHUTDOWN_TIMEOUT_SEC: ${ENGINE_SHUTDOWN_TIMEOUT_SEC:-30}

      # ---- camera health ----------------------------------------------
      HEARTBEAT_TIMEOUT_SEC: ${HEARTBEAT_TIMEOUT_SEC:-15}
      CAMERA_OFFLINE_GRACE_SECONDS: ${CAMERA_OFFLINE_GRACE_SECONDS:-10}

      # ---- internal-processing-error auto-restart ----------------------
      ERROR_RESTART_MAX_RETRIES: ${ERROR_RESTART_MAX_RETRIES:-1}
      ERROR_RESTART_DELAY_SEC: ${ERROR_RESTART_DELAY_SEC:-3}
      ERROR_RESTART_COUNTER_RESET_AFTER_SEC: ${ERROR_RESTART_COUNTER_RESET_AFTER_SEC:-600}

      # ---- spatial-grid threat verification ----------------------------
      GRID_WINDOW_SIZE: ${GRID_WINDOW_SIZE:-30}
      GRID_VERIFY_THRESHOLD: ${GRID_VERIFY_THRESHOLD:-22}
      GRID_COOLDOWN_FRAMES: ${GRID_COOLDOWN_FRAMES:-90}

      # ---- RTSP reader ---------------------------------------------------
      RTSP_OPEN_TIMEOUT_MS: ${RTSP_OPEN_TIMEOUT_MS:-5000}
      RTSP_READ_TIMEOUT_MS: ${RTSP_READ_TIMEOUT_MS:-5000}
      RTSP_FFMPEG_STIMEOUT_US: ${RTSP_FFMPEG_STIMEOUT_US:-5000000}
      RTSP_RECONNECT_BACKOFF_SEC: ${RTSP_RECONNECT_BACKOFF_SEC:-0.2}
      RTSP_READ_FAIL_BACKOFF_SEC: ${RTSP_READ_FAIL_BACKOFF_SEC:-0.5}
      RTSP_READER_JOIN_TIMEOUT_SEC: ${RTSP_READER_JOIN_TIMEOUT_SEC:-2.0}

      # ---- engine loop / heartbeat ----------------------------------------
      SLOW_BATCH_WARN_MS: ${SLOW_BATCH_WARN_MS:-150.0}
      PIPELINE_STATS_LOG_INTERVAL_SEC: ${PIPELINE_STATS_LOG_INTERVAL_SEC:-5.0}
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-10}
      HEARTBEAT_TTL_SEC: ${HEARTBEAT_TTL_SEC:-30}

      # ---- MinIO (THREAT/RESOLUTION alert crops) -----------------------
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      AWS_ACCESS_KEY_ID_FULL: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY_FULL: ${MINIO_ROOT_PASSWORD}
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_USE_SSL: ${MINIO_SECURE:-False}
      AWS_PRIVATE_BUCKET_NAME: ${MINIO_PRIVATE_BUCKET:-eyepass-private-bucket}

      # ---- debug output (local bind volume — never MinIO) -----------
      DEBUG_VIDEO_ENABLED: ${DETECTOR_DEBUG_VIDEO_ENABLED:-false}
      DEBUG_VIDEO_DIR: /debug
      DEBUG_VIDEO_SEGMENT_SECONDS: ${DEBUG_VIDEO_SEGMENT_SECONDS:-240}
      DEBUG_VIDEO_FPS: ${DEBUG_VIDEO_FPS:-12}
      DEBUG_VIDEO_MAX_SEGMENTS: ${DEBUG_VIDEO_MAX_SEGMENTS:-12}
      DEBUG_VIDEO_SCALE: ${DEBUG_VIDEO_SCALE:-1.0}
      DEBUG_VIDEO_EVERY_N: ${DEBUG_VIDEO_EVERY_N:-1}
      DEBUG_VIDEO_CODEC: ${DEBUG_VIDEO_CODEC:-mp4v}
      DEBUG_VIDEO_EXT: ${DEBUG_VIDEO_EXT:-.mp4}
      DEBUG_VIDEO_JSONL: ${DEBUG_VIDEO_JSONL:-true}

      LOG_FORMAT: ${LOG_FORMAT:-text}
      API_PORT: "8012"

    depends_on:
      mediamtx:
        condition: service_started

    volumes:
      # Model weights, mounted rather than baked so swapping the model
      # needs no rebuild. Operator supplies best.pt here.
      - ${DETECTION_MODELS_DIR:-./models/detection}:/models:ro
      # Annotated debug video. A BIND mount, not a named volume, on
      # purpose: meant to be opened straight off your own disk.
      - ${DEBUG_VIDEO_HOST_DIR:-./debug_video}:/debug
    ports:
      - "${DETECTOR_API_PORT:-8012}:8012"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s        # YOLO load + CUDA init is slow on first boot
    stop_grace_period: 60s      # must exceed ENGINE_SHUTDOWN_TIMEOUT_SEC
    # GPU reservation. Requires nvidia-container-toolkit on the host.
    # Delete this whole `deploy:` block to run on a host with no GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

